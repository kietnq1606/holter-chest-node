# AD8232 and calibration mode control.
CONFIG_ADC=y
CONFIG_GPIO=y

# Print calibration results through RTT.
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Disable unused peripherals that a board may enable by default.
CONFIG_FLASH=n
CONFIG_SPI=n
CONFIG_I2C=n
