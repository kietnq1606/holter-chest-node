CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
# Debug + Info + Warning + Error
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_ADC=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NAND=y
CONFIG_CRC=y
CONFIG_SERIAL=y
#CONFIG_AD8232=y
CONFIG_BMI323=n


# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Holter-000"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251


#debug 
# USB Device Controller request buffer pool
CONFIG_UDC_BUF_POOL_SIZE=8192
