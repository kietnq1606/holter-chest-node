description: Bosch BMI323 inertial measurement unit
compatible: "bosch,bmi323"
include: i2c-device.yaml
on-bus: i2c

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the BMI323 INT1 pin
