description: "Analog Devices AD8232 Heart Rate Monitor Front-End"
compatible: "adi,ad8232"
include: base.yaml
properties:
  sample-timer:
    type: phandle
    required: true
    description: Dedicated hardware TIMER reserved for 500 Hz SAADC triggering
  io-channels:
    type: phandle-array
    required: true
    description: "ADC channel for the AD8232 output signal"
  lo-plus-gpios:
    type: phandle-array
    required: true
    description: "GPIO for LO+ output"
  lo-minus-gpios:
    type: phandle-array
    required: true
    description: "GPIO for LO- output"
